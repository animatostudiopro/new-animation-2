# Animato music generator — writes a full song (vocals + music) on the runner's CPU (no API keys).
#
# Installed and kept up to date automatically by the Animato app.
# Edits made here are overwritten on the next update; change
# server/bootstrap/music.yml in the app instead.
#
# Used by Tools -> Music generation in the app, and runnable by hand from the Actions tab.
# Model: ACE-Step 1.5 turbo (MIT licence), DiT-only mode (no planner LM), on CPU.
# Nothing is cached between runs (the repository's cache quota is used by the other tools):
# every run installs the engine and downloads the ~6.3 GB model again.
# The song is attached to the run as the "animato-music-<run id>" artifact (song.mp3 + meta.json).

name: Animato Music Generator

run-name: "Animato music ${{ inputs.request_id || inputs.title }}"

on:
  workflow_dispatch:
    inputs:
      title:
        description: Song title (optional)
        type: string
        default: ''
      lyrics:
        description: Lyrics ([Verse] / [Chorus] tags optional; empty = instrumental)
        type: string
        default: ''
      style:
        description: Style preset (pop, afrobeats, amapiano, hiphop, trap, rnb, gospel, highlife, reggae, dancehall, rock, edm, lofi, jazz, country, kpop, latin, cinematic, acoustic, custom)
        type: string
        default: pop
      custom_style:
        description: Extra style words (optional, e.g. "summer vibe, saxophone solo")
        type: string
        default: ''
      singer:
        description: Singer (female_pop, female_soul, female_soft, male_pop, male_deep, male_rock, male_rap, female_rap, choir, duet)
        type: string
        default: female_pop
      language:
        description: Language code (en, fr, es, pt, sw, zh, ... ; pcm = Nigerian Pidgin, unknown = auto)
        type: string
        default: en
      duration:
        description: Length in seconds (10-600)
        type: string
        default: '60'
      seed:
        description: Seed (same inputs + seed = same song)
        type: string
        default: '1'
      request_id:
        description: Set by the app to find this run
        type: string
        default: ''

permissions:
  contents: read

jobs:
  generate:
    name: Compose the song
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # ACE-Step 1.5 source, pinned (main @ 2026-08-29).
      ACESTEP_REF: ca1e85fe9430179831e6bc6be790c332190a3866
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_ENABLE_HF_TRANSFER: '0'
      TOKENIZERS_PARALLELISM: 'false'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space and memory
        run: |
          df -h / /mnt 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          # Work on the big scratch disk when the runner has one.
          if sudo mkdir -p /mnt/animato-music 2>/dev/null && sudo chown "$(id -u):$(id -g)" /mnt/animato-music; then
            MUSIC_HOME=/mnt/animato-music
          else
            MUSIC_HOME="$HOME/animato-music"; mkdir -p "$MUSIC_HOME"
          fi
          echo "MUSIC_HOME=$MUSIC_HOME" >> "$GITHUB_ENV"
          echo "ACESTEP_CHECKPOINTS_DIR=$MUSIC_HOME/checkpoints" >> "$GITHUB_ENV"
          echo "HF_HOME=$MUSIC_HOME/hf" >> "$GITHUB_ENV"
          # The model needs ~13 GB of RAM in float32; extra swap keeps a 16 GB runner from being killed.
          SWAP="$(dirname "$MUSIC_HOME")/animato-swap"
          if sudo fallocate -l 10G "$SWAP" 2>/dev/null && sudo chmod 600 "$SWAP" && sudo mkswap "$SWAP" >/dev/null && sudo swapon "$SWAP"; then
            echo "added 10 GB of swap at $SWAP"
          else
            echo "::warning::could not add swap - continuing with the runner's default"
          fi
          free -h; nproc; df -h / "$MUSIC_HOME"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the music engine
        run: |
          set -e
          echo "[songgen] [installing] Python packages + ACE-Step $ACESTEP_REF"
          VENV="$MUSIC_HOME/venv"
          python -m venv "$VENV"
          PIP="$VENV/bin/pip"
          "$PIP" install --quiet --upgrade pip wheel
          printf 'torch==2.10.0\ntorchvision==0.25.0\ntorchaudio==2.10.0\n' > "$MUSIC_HOME/constraints.txt"
          "$PIP" install --quiet torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          "$PIP" install --quiet -c "$MUSIC_HOME/constraints.txt" \
            "transformers>=4.51.0,<4.58.0" "diffusers>=0.37.0" "scipy>=1.10.1" "soundfile>=0.13.1" "loguru>=0.7.3" \
            "einops>=0.8.1" "accelerate>=1.12.0" diskcache "numba>=0.63.1" "vector-quantize-pytorch>=1.27.15" \
            "torchao>=0.16.0,<0.17.0" toml "peft>=0.18.0" lycoris-lora "lightning>=2.0.0" "tensorboard>=2.20.0" \
            modelscope "typer-slim>=0.21.1" "pytorch-wavelets>=1.3.0" "pywavelets>=1.9.0" "setuptools<72" \
            "matplotlib>=3.7.5" "fastapi>=0.110.0" "uvicorn[standard]>=0.27.0" "python-multipart>=0.0.18" \
            "gradio==6.2.0" huggingface_hub
          # torchaudio 2.10 reads/writes audio through torchcodec; the song itself is written with soundfile.
          "$PIP" install --quiet -c "$MUSIC_HOME/constraints.txt" "torchcodec>=0.10,<0.11" || echo "::warning::torchcodec could not be installed - not needed for text-to-music"
          mkdir -p "$MUSIC_HOME/ace-step"
          curl -fsSL --retry 3 "https://github.com/ACE-Step/ACE-Step-1.5/archive/${ACESTEP_REF}.tar.gz" -o "$MUSIC_HOME/acestep.tgz"
          tar -xzf "$MUSIC_HOME/acestep.tgz" --strip-components=1 -C "$MUSIC_HOME/ace-step"
          rm -f "$MUSIC_HOME/acestep.tgz"
          # nano-vllm only serves the planner LM, which this workflow does not use.
          "$PIP" install --quiet --no-deps "$MUSIC_HOME/ace-step/acestep/third_parts/nano-vllm" || echo "::warning::nano-vllm not installed (only needed by the planner LM, which is not used)"
          echo "PYTHONPATH=$MUSIC_HOME/ace-step" >> "$GITHUB_ENV"
          PYTHONPATH="$MUSIC_HOME/ace-step" "$VENV/bin/python" -c "import torch, acestep.handler, acestep.inference; print('[songgen] [installing] ready: torch', torch.__version__)"
          df -h "$MUSIC_HOME"

      - name: Download the music model
        run: |
          echo "[songgen] [downloading model] ACE-Step/Ace-Step1.5 (turbo DiT + VAE + text encoder)"
          "$MUSIC_HOME/venv/bin/python" animato-cloud/songgen.py download
          du -sh "$ACESTEP_CHECKPOINTS_DIR"/* || true
          df -h "$MUSIC_HOME"

      - name: Compose the song
        env:
          # Everything is passed as environment data, never pasted into code, so quotes in lyrics are harmless.
          SONG_TITLE: ${{ inputs.title }}
          SONG_LYRICS: ${{ inputs.lyrics }}
          SONG_STYLE: ${{ inputs.style }}
          SONG_CUSTOM_STYLE: ${{ inputs.custom_style }}
          SONG_SINGER: ${{ inputs.singer }}
          SONG_LANGUAGE: ${{ inputs.language }}
          SONG_DURATION: ${{ inputs.duration }}
          SONG_SEED: ${{ inputs.seed }}
        run: |
          mkdir -p output
          python - <<'PY'
          import json, os
          def num(name, default, lo, hi):
              try:
                  return max(lo, min(hi, int(float(os.environ.get(name) or default))))
              except ValueError:
                  return default
          job = {
              "title": os.environ.get("SONG_TITLE", "")[:120],
              "lyrics": os.environ.get("SONG_LYRICS", "")[:4000],
              "style": (os.environ.get("SONG_STYLE") or "pop")[:40],
              "custom_style": os.environ.get("SONG_CUSTOM_STYLE", "")[:300],
              "singer": (os.environ.get("SONG_SINGER") or "female_pop")[:40],
              "language": (os.environ.get("SONG_LANGUAGE") or "en")[:10],
              "duration": num("SONG_DURATION", 60, 10, 600),
              "seed": num("SONG_SEED", 1, 0, 2**32 - 2),
              "out": "output",
          }
          json.dump(job, open("song_job.json", "w"), ensure_ascii=False)
          PY
          "$MUSIC_HOME/venv/bin/python" animato-cloud/songgen.py generate --job song_job.json
          ls -la output

      - name: Attach the song to the run
        uses: actions/upload-artifact@v4
        with:
          name: animato-music-${{ github.run_id }}
          path: |
            output/song.mp3
            output/meta.json
          retention-days: 3
          if-no-files-found: error
