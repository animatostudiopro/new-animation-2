# Animato AI Character Rig — generate one detailed character or dissect a user image,
# then turn it into transparent animation layers. Installed by the Animato pipeline bundle.
name: Animato AI Character Rig
run-name: "Animato character ${{ inputs.request_id || inputs.mode }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: generate = DreamShaper character; upload = dissect user image
        type: choice
        default: generate
        options: [generate, upload]
      prompt:
        description: Character prompt (used for generate mode)
        type: string
        default: "realistic young woman, front-facing, neutral expression, natural skin, detailed eyes and hair"
      source_asset_id:
        description: SHA-1 asset id uploaded to Animato (used for upload mode)
        type: string
        default: ''
      app_url:
        description: Animato app URL used to download an uploaded reference image
        type: string
        required: true
      gender:
        description: Character gender
        type: choice
        default: female
        options: [female, male]
      full_body:
        description: Generate/use a full-body character
        type: choice
        default: 'false'
        options: ['true', 'false']
      plan_json:
        description: JSON design plan produced by Animato's existing AI planner
        type: string
        default: '{}'
      seed:
        description: Reproducible generation seed
        type: string
        default: '1'
      request_id:
        description: Set by the app to find this run
        type: string
        default: ''

permissions:
  contents: read

jobs:
  rig:
    name: Build animation-ready character
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache AI character engine
        uses: actions/cache@v4
        with:
          path: |
            ~/character-venv
            ~/.cache/huggingface
            ~/.cache/animato-character
          key: animato-character-v3-${{ runner.os }}-py${{ steps.py.outputs.python-version }}

      - name: Set up AI character engine
        run: |
          set -e
          VENV="$HOME/character-venv"
          if [ -d "$VENV" ] && ! "$VENV/bin/python" -c "import torch, diffusers, onnxruntime" >/dev/null 2>&1; then rm -rf "$VENV"; fi
          if [ ! -f "$VENV/.ready-v3" ]; then
            rm -rf "$VENV"
            python -m venv "$VENV"
            "$VENV/bin/pip" install --quiet --disable-pip-version-check --upgrade pip
            "$VENV/bin/pip" install --quiet --disable-pip-version-check torch torchvision --index-url https://download.pytorch.org/whl/cpu
            "$VENV/bin/pip" install --quiet --disable-pip-version-check diffusers transformers accelerate safetensors peft pillow numpy onnxruntime opencv-python-headless rembg
            "$VENV/bin/python" -c "from huggingface_hub import snapshot_download; snapshot_download('PayamFard123/dermaintel-face-parsing', cache_dir='$HOME/.cache/animato-character')"
            # The first generate run will cache the detailed DreamShaper and inpainting model.
            "$VENV/bin/python" -c "from huggingface_hub import snapshot_download; snapshot_download('Lykon/dreamshaper-8-inpainting', cache_dir='$HOME/.cache/animato-character')" || echo "::warning::DreamShaper inpainting pre-download failed; it will retry during the job"
            "$VENV/bin/python" -c "from huggingface_hub import snapshot_download; snapshot_download('IDKiro/sdxs-512-dreamshaper', cache_dir='$HOME/.cache/animato-character')" || true
            touch "$VENV/.ready-v3"
          fi
          "$VENV/bin/python" -c "import torch, diffusers, onnxruntime; print('character engine ready', torch.__version__, diffusers.__version__)"

      - name: Generate detailed base character
        if: inputs.mode == 'generate'
        env:
          IMG_PROMPT: ${{ inputs.prompt }}
          PLAN: ${{ inputs.plan_json }}
          IMG_SEED: ${{ inputs.seed }}
          IMG_FULL: ${{ inputs.full_body }}
        run: |
          set -e
          mkdir -p input
          python - <<'PY'
          import json, os
          try: p=json.loads(os.environ.get('PLAN','{}'))
          except: p={}
          prompt=p.get('render_prompt') or os.environ.get('IMG_PROMPT','')
          framing='full body, head to toe' if os.environ.get('IMG_FULL')=='true' else 'waist-up portrait'
          prompt=("front-facing, centered single person, neutral relaxed expression, symmetrical camera view, " + framing + ", plain light studio background, no props, no text, " + prompt)[:1200]
          job={"prompt":prompt,"profile":"detail","mode":"","style":"photorealistic character portrait, natural skin texture, realistic eyes, clean studio lighting","width":768,"height":1024,"seed":int(os.environ.get('IMG_SEED') or '1'),"out":"input/generated.png"}
          json.dump(job,open('job.json','w'))
          PY
          "$HOME/character-venv/bin/python" animato-cloud/imagegen.py batch --jobs job.json

      - name: Download uploaded reference image
        if: inputs.mode == 'upload'
        env:
          APP_URL: ${{ inputs.app_url }}
          ASSET_ID: ${{ inputs.source_asset_id }}
        run: |
          set -e
          mkdir -p input
          url="${APP_URL%/}/api/automation/assets/${ASSET_ID}"
          curl --fail --location --retry 4 --retry-delay 2 --max-time 120 -o input/source.jpg "$url"
          test -s input/source.jpg

      - name: Dissect, restore and rig the character
        env:
          MODE: ${{ inputs.mode }}
          GENDER: ${{ inputs.gender }}
          FULL_BODY: ${{ inputs.full_body }}
          PLAN: ${{ inputs.plan_json }}
          SEED: ${{ inputs.seed }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: |
          set -e
          mkdir -p output/rig
          export CHARACTER_CACHE="$HOME/.cache/animato-character"
          export CHARACTER_ENABLE_INPAINT=1
          export CHARACTER_INPAINT_STEPS=20
          export CHARACTER_VARIANT_STEPS=12
          export CHARACTER_GENERATE_VARIANTS=1
          if [ "$MODE" = "generate" ]; then SRC=input/generated.png; else SRC=input/source.jpg; fi
          "$HOME/character-venv/bin/python" animato-cloud/character_pipeline.py --input "$SRC" --output output/rig --mode "$MODE" --gender "$GENDER" $([ "$FULL_BODY" = "true" ] && echo --full-body) --seed "${SEED:-1}" --plan "$PLAN"

      - name: Attach character rig
        uses: actions/upload-artifact@v4
        with:
          name: animato-character-${{ github.run_id }}
          path: output/rig
          retention-days: 3
          if-no-files-found: error
