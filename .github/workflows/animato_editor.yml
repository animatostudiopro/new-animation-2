# Animato — AI Auto Video Editor.
#
# Installed and kept up to date automatically by the Animato app.
# One run edits ONE upload: transcribe the voice, cut fillers / retakes /
# dead air, match the video to what is said and compile the final MP4.

name: Animato AI Video Editor

run-name: "Animato editor · ${{ github.event.client_payload.job.title || 'video' }} [${{ github.event.client_payload.job_id || 'manual' }}]"

on:
  repository_dispatch:
    types: [edit_video]

permissions:
  contents: read

concurrency:
  group: animato-editor-${{ github.event.client_payload.job_id || github.run_id }}
  cancel-in-progress: false

jobs:
  edit:
    name: Edit video
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python (local transcription fallback)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          ffmpeg -hide_banner -version | head -n 1

      - name: Edit the video
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        run: node --experimental-strip-types animato-cloud/editor.mts

      - name: Keep the edited video as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animato-edit-${{ github.run_id }}
          path: |
            output/editor/edited.mp4
            output/editor/captions.srt
          retention-days: 7
          if-no-files-found: ignore
